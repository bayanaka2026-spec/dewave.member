<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>deWAVE Staff Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f1e8;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .header {
      background: #111;
      color: #d8bd78;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      margin-bottom: 18px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .title {
      margin-top: 6px;
      font-size: 14px;
      color: #fff;
    }

    .scanner-card {
      background: #fff;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 16px;
      background: #111;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 16px;
    }

    #reader__scan_region {
      border-radius: 16px;
      overflow: hidden;
    }

    #reader__dashboard {
      padding: 12px !important;
    }

    #reader__dashboard_section_csr {
      display: none !important;
    }

    #reader__dashboard_section_swaplink {
      margin-top: 10px;
    }

    #reader button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      background: #111;
      color: #d8bd78;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #f5f1e8;
      text-align: center;
      font-size: 14px;
    }

    .result {
      display: none;
      margin-top: 16px;
      padding: 18px;
      background: #111;
      color: #fff;
      border-radius: 16px;
      text-align: center;
    }

    .result.show {
      display: block;
    }

    .result-label {
      font-size: 12px;
      color: #d8bd78;
      margin-bottom: 8px;
    }

    .member-id {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #fff;
      word-break: break-word;
    }

    .close-btn {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #d8bd78;
      color: #111;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .error {
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: #f8e8e8;
      color: #8a2222;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .error.show {
      display: block;
    }

    .hint {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">deWAVE</div>
    <div class="title">STAFF QR SCANNER</div>
  </div>

  <div class="scanner-card">

    <div id="reader"></div>

    <div id="status" class="status">
      Mengaktifkan kamera...
    </div>

    <div id="errorBox" class="error"></div>

    <div id="resultBox" class="result">

      <div class="result-label">
        MEMBER ID
      </div>

      <div id="memberId" class="member-id">
        -
      </div>

      <button
        class="close-btn"
        onclick="closeScanner()"
      >
        TUTUP SCANNER
      </button>

    </div>

    <div class="hint">
      Arahkan kamera ke QR Member deWAVE.
      <br>
      Setelah QR terbaca, data akan dikirim kembali ke halaman Staff.
    </div>

  </div>


  <script>

    let html5QrCode = null;
    let scanFinished = false;


    function setStatus(text) {
      document.getElementById("status").innerText = text;
    }


    function showError(text) {
      const box = document.getElementById("errorBox");

      box.innerText = text;
      box.classList.add("show");
    }


    function hideError() {
      document
        .getElementById("errorBox")
        .classList.remove("show");
    }


    function showResult(memberId) {

      document.getElementById("memberId").innerText = memberId;

      document
        .getElementById("resultBox")
        .classList.add("show");

    }


    function sendResultToParent(memberId) {

      /*
       * Kirim hasil scan ke halaman Apps Script
       */
      if (window.opener && !window.opener.closed) {

        window.opener.postMessage(
          {
            type: "DEWAVE_MEMBER_SCAN",
            memberId: memberId
          },
          "*"
        );

      }

    }


    async function stopScanner() {

      try {

        if (html5QrCode) {

          await html5QrCode.stop();

          await html5QrCode.clear();

        }

      } catch (e) {

        console.log("Scanner stop:", e);

      }

    }


    async function onScanSuccess(decodedText, decodedResult) {

      if (scanFinished) {
        return;
      }

      scanFinished = true;

      const memberId = String(decodedText || "").trim();

      if (!memberId) {

        scanFinished = false;

        return;

      }

      hideError();

      setStatus("QR berhasil dibaca.");

      showResult(memberId);

      /*
       * Kirim Member ID ke halaman Staff Apps Script
       */
      sendResultToParent(memberId);

      /*
       * Matikan kamera
       */
      await stopScanner();

      /*
       * Tutup window scanner setelah sebentar
       */
      setTimeout(function() {

        if (window.opener && !window.opener.closed) {
          window.close();
        }

      }, 700);

    }


    function onScanFailure(errorMessage) {

      /*
       * Jangan tampilkan error setiap frame.
       * html5-qrcode memang akan memanggil
       * fungsi ini saat QR belum terbaca.
       */

    }


    async function startScanner() {

      hideError();

      setStatus("Meminta izin kamera...");

      try {

        html5QrCode = new Html5Qrcode("reader");

        const config = {

          fps: 10,

          qrbox: function(viewfinderWidth, viewfinderHeight) {

            const size = Math.min(
              Math.floor(viewfinderWidth * 0.72),
              Math.floor(viewfinderHeight * 0.72),
              320
            );

            return {
              width: size,
              height: size
            };

          },

          aspectRatio: 1.0,

          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE
          ]

        };


        await html5QrCode.start(

          {
            facingMode: "environment"
          },

          config,

          onScanSuccess,

          onScanFailure

        );


        setStatus(
          "Kamera aktif. Arahkan ke QR Member."
        );


      } catch (error) {

        console.error(error);

        setStatus("Kamera tidak dapat digunakan.");

        showError(
          "Tidak dapat mengakses kamera. " +
          "Pastikan izin kamera sudah diberikan " +
          "dan halaman dibuka melalui HTTPS."
        );

      }

    }


    async function closeScanner() {

      await stopScanner();

      if (window.opener && !window.opener.closed) {

        window.close();

      } else {

        history.back();

      }

    }


    /*
     * Jika scanner dibuka dari Apps Script,
     * fokus kembali ke halaman Staff.
     */
    window.addEventListener("beforeunload", function() {

      try {

        if (html5QrCode) {
          html5QrCode.stop();
        }

      } catch (e) {}

    });


    /*
     * Jalankan scanner setelah halaman siap.
     */
    window.addEventListener("load", function() {

      setTimeout(function() {

        startScanner();

      }, 300);

    });

  </script>

</body>
</html>
